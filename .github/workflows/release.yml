name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: 校验 tag 与代码版本一致
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          node -e 'const fs=require("fs");const expected=process.env.TAG_VERSION.replace(/^v/,"");const pkg=require("./package.json");const files=["src/service.ts","src/cli.ts"];if(pkg.name!=="@shilem/codex-telegram-bridge"||pkg.version!==expected||files.some(f=>!fs.readFileSync(f,"utf8").includes(`\"${expected}\"`))){throw new Error(`发布元数据不一致 tag=${expected} package=${pkg.name}@${pkg.version}`)}'
      - run: npm audit --audit-level=high
      - run: npm sbom --sbom-format cyclonedx > codex-telegram-bridge.cdx.json
      - id: pack
        run: echo "archive=$(npm pack --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s)[0].filename))')" >> "$GITHUB_OUTPUT"
      - name: 将锁文件注入签名发布包
        env:
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: |
          mkdir release-package
          tar -xzf "$ARCHIVE" -C release-package
          cp npm-shrinkwrap.json release-package/package/npm-shrinkwrap.json
          tar -czf "$ARCHIVE" -C release-package package
          tar -tzf "$ARCHIVE" | grep -Fx 'package/npm-shrinkwrap.json'
          cp "$ARCHIVE" codex-telegram-bridge.tgz
      - name: 生成签名清单
        env:
          ARCHIVE: codex-telegram-bridge.tgz
          VERSION: ${{ github.ref_name }}
          CTB_RELEASE_SIGNING_KEY: ${{ secrets.CTB_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$CTB_RELEASE_SIGNING_KEY"
          printf '%s' "$CTB_RELEASE_SIGNING_KEY" > signing-key.pem
          chmod 600 signing-key.pem
          SHA=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          SHA="$SHA" node -e 'const fs=require("fs");fs.writeFileSync("release-manifest.json",JSON.stringify({version:process.env.VERSION.replace(/^v/,""),archive:process.env.ARCHIVE,sha256:process.env.SHA})+"\n")'
          openssl dgst -sha256 -sign signing-key.pem -out release-manifest.sig release-manifest.json
          sha256sum "$ARCHIVE" codex-telegram-bridge.cdx.json release-manifest.json release-manifest.sig > SHA256SUMS
          rm signing-key.pem
      - run: npm publish --provenance --access public
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            codex-telegram-bridge.tgz
            codex-telegram-bridge.cdx.json
            release-manifest.json
            release-manifest.sig
            SHA256SUMS
